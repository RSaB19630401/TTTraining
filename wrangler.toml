name = "tt-training"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static frontend served from ./public
[assets]
directory = "./public"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "tt-training-db"
database_id = "d9667a8f-f7b8-445e-8238-f5c4ec48d85f"

# Environment variables (nicht-geheime Werte)
[vars]
INITIAL_VEREIN = "TV Brühl 1912"

# WICHTIG: JWT_SECRET wird separat als Secret gesetzt:
# wrangler secret put JWT_SECRET
# Für lokale Entwicklung: .dev.vars anlegen (siehe .dev.vars.example)
